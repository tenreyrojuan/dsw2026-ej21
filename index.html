<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="stylesheet.css" />
    <title>Dashboard</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <button class="mobile-nav-toggle" id="toggle-button" >Menu</button>
      </header>
      <nav class="nav" id="navbar">Sidebar</nav>
      <main id="main" class="main">
        Contenido Principal
        <button id="add-button" class="add-button">Añadir</button>
      </main>
      <footer class="footer">Pie de Pagina</footer>
    </div>
  </body>
  <script>

    class Paciente {
      constructor(nroPaciente,nombrePaciente) {
       this.nroPaciente = nroPaciente;
       this.nombrePaciente = nombrePaciente; 
      }
    }

    function agregarFila(nroPaciente,nombrePaciente) {
      let paciente = new Paciente(nroPaciente,nombrePaciente);

      const tbody = document.querySelector("#tabla tbody");
      const fila = document.createElement("tr");
      const celdaElemento1 = document.createElement("td");
      const celdaElemento2 = document.createElement("td");

      celdaElemento1.textContent = paciente.nroPaciente;
      celdaElemento2.textContent = paciente.nombrePaciente;

      fila.appendChild(celdaElemento1);
      fila.appendChild(celdaElemento2);

      tbody.appendChild(fila);
    }

    const toggleButton = document.getElementById("toggle-button"); 
    const navbar = document.getElementById("navbar");

    toggleButton.addEventListener("click", () => {
      navbar.classList.toggle("shown");
    });


    
    const addButton = document.getElementById("add-button");
    
    const patient1 = new Paciente(1,"Julian");
    const patient2 = new Paciente(2,"Maria");
    let arrayPatients = new Array(patient1,patient2);
    
    addButton.addEventListener("click", () => {
        const table = document.createElement("table");

        const thead = document.createElement("thead");

        const array = new Array("Numero de Turno","Numero de paciente");

        let headContent = document.createElement("tr");
        array.forEach(elemento => {
            const cell = document.createElement("th");
            cell.textContent = elemento;
            headContent.appendChild(cell);
        });
        thead.appendChild(headContent);
        table.appendChild(thead);
        const tbody = document.createElement("tbody");


        arrayPatients.forEach(patient => {
            const row = document.createElement("tr");

            const cell1 = document.createElement("td");
            const cell2 = document.createElement("td");
            cell1.textContent = patient.nroPaciente;
            cell2.textContent = patient.nombrePaciente;

            row.appendChild(cell1);
            row.appendChild(cell2);
            
            tbody.appendChild(row);
        });

        table.appendChild(tbody);
        table.classList.add("added")
        
        const mainContainer = document.querySelector("#main");
        mainContainer.appendChild(table);
    });
  
  </script>
</html>
